name: Feature request
description: Suggest an improvement for job seekers.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem does this solve for a job seeker? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What would you like to happen? }
    validations: { required: true }
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: Works locally without a hosted service or paid feature
        - label: Never sends messages or applications without an explicit user action
